// ─── FESTIVOS COLOMBIA 2026 ──────────────────────────────────────────────────
const FESTIVOS = new Set([
  "2026-01-01","2026-01-12","2026-03-23","2026-04-02","2026-04-03",
  "2026-05-01","2026-05-18","2026-06-08","2026-06-15","2026-06-29",
  "2026-07-20","2026-08-07","2026-08-17","2026-10-12","2026-11-02",
  "2026-11-16","2026-12-08","2026-12-25",
]);
function esFestivo(f){return FESTIVOS.has(f.toISOString().split("T")[0]);}
function esDomingo(f){return f.getDay()===0;}
function esFestDom(f){return esDomingo(f)||esFestivo(f);}
function esNocturno(h){return h>=19||h<6;}

function parseHora(t){
  t=t.trim().toUpperCase();
  const m=t.match(/^(\d+)(AM|PM)$/);
  if(!m)return null;
  let h=parseInt(m[1]);
  if(m[2]==="AM"){if(h===12)h=0;}else{if(h!==12)h+=12;}
  return h;
}

function parseTurno(texto){
  if(!texto)return null;
  const t=texto.toString().trim().toUpperCase();
  const ig=["DESCANSO","VACACIONES","DIA DE LA FAMILIA","D/DAS","SAC-MARAYA",
    "COLINAS DE PAZ","P-OFRENDA","JURADO DE VOTACION","CUBA","CALL CENTER"];
  for(const x of ig)if(t.includes(x))return null;
  const horas=t.split("-").map(parseHora).filter(h=>h!==null);
  if(!horas.length)return null;
  const segs=[];
  if(horas.length===2){let[a,b]=horas;if(b<=a)b+=24;segs.push({ini:a,fin:b});}
  else if(horas.length===3){let[a,b,c]=horas;if(b<=a)b+=24;if(c<=a)c+=24;if(c<b)c+=24;segs.push({ini:a,fin:c});}
  else if(horas.length===4){let[a,b,c,d]=horas;if(b<=a)b+=24;if(c<a)c+=24;if(d<=c)d+=24;segs.push({ini:a,fin:b});segs.push({ini:c,fin:d});}
  return segs.length?segs:null;
}

function clasificar(segs,fecha){
  const fd=esFestDom(fecha);
  const r={DOMINICAL:0,"REC. NOCT. FEST":0,"REC. NOCT":0,"H.E.D":0,"H.E.N":0,"H.E.F.D":0,"H.E.F.N":0};
  let ord=0;
  for(const seg of segs){
    let c=seg.ini;
    while(c<seg.fin){
      const nx=Math.min(c+0.5,seg.fin);const fr=nx-c;
      const noc=esNocturno(c%24);const ex=ord>=8;
      if(!ex){
        if(fd){if(noc)r["REC. NOCT. FEST"]+=fr;else r["DOMINICAL"]+=fr;}
        else if(noc)r["REC. NOCT"]+=fr;
        ord+=fr;
      }else{
        if(fd){if(noc)r["H.E.F.N"]+=fr;else r["H.E.F.D"]+=fr;}
        else{if(noc)r["H.E.N"]+=fr;else r["H.E.D"]+=fr;}
      }
      c=nx;
    }
  }
  for(const k of Object.keys(r))r[k]=Math.round(r[k]*100)/100;
  return r;
}

const DIAS=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const MESES={ENERO:0,FEBRERO:1,MARZO:2,ABRIL:3,MAYO:4,JUNIO:5,
  JULIO:6,AGOSTO:7,SEPTIEMBRE:8,OCTUBRE:9,NOVIEMBRE:10,DICIEMBRE:11};
const COLS=["DOMINICAL","REC. NOCT. FEST","REC. NOCT","H.E.D","H.E.N","H.E.F.D","H.E.F.N"];

function extraerMes(titulo){
  if(!titulo)return null;
  const t=titulo.toString().toUpperCase();
  for(const[n,i]of Object.entries(MESES)){
    if(t.includes(n)){const m=t.match(/(\d{4})/);return{mes:i,anio:m?parseInt(m[1]):new Date().getFullYear()};}
  }
  return null;
}

function ignorar(n){
  if(!n)return true;
  const t=n.toString().trim().toUpperCase();
  const kw=["AUXILIARES","CONDUCTORES","TANATOPRACTICOS","RECEPCION","ADMINISTRACION",
    "COORDINADORES","RED ANGEL","NOTA","DESCANSO","SEPELIO","TRASLADO","MENSAJERO"];
  for(const k of kw)if(t.includes(k)&&t.split(" ").length<=5)return true;
  return false;
}

function celda(ws,fila,col){
  const addr=XLSX.utils.encode_cell({r:fila-1,c:col-1});
  const cell=ws[addr];
  return(cell&&cell.v!==undefined&&cell.v!==null)?cell.v:null;
}

function procesarWB(wb,desde,hasta){
  const cols={};
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    if(!ws['!ref'])continue;
    const rango=XLSX.utils.decode_range(ws['!ref']);
    const maxFila=rango.e.r+1;
    const maxCol=Math.min(rango.e.c+1,9);
    const titulo=celda(ws,1,2);
    const ma=extraerMes(titulo);
    if(!ma)continue;
    const cm={};
    for(let c=3;c<=maxCol;c++){
      const diaTxt=celda(ws,2,c);
      const numDia=celda(ws,3,c);
      if(typeof numDia!=='number')continue;
      const dia=(diaTxt||'').toString().trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      const di=DIAS.findIndex(x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").startsWith(dia.substring(0,4)||"x"));
      cm[c]={diaSemana:di>=0?DIAS[di]:dia,numDia};
    }
    if(!Object.keys(cm).length)continue;
    const allN=Object.values(cm).map(v=>v.numDia);
    const hasLate=allN.some(n=>n>=28);
    const hasEarly=allN.some(n=>n<=7);
    for(let r=4;r<=maxFila;r++){
      const nom=(celda(ws,r,2)||'').toString().trim();
      if(!nom||ignorar(nom))continue;
      const key=nom.toUpperCase().replace(/\s+/g," ");
      for(const[cStr,ci]of Object.entries(cm)){
        const c=parseInt(cStr);
        const tr=(celda(ws,r,c)||'').toString().trim();
        if(!tr)continue;
        let{mes,anio}=ma;let mf=mes,af=anio;
        if(hasLate&&hasEarly&&ci.numDia<=7){mf=mes+1;if(mf>11){mf=0;af=anio+1;}}
        const fecha=new Date(af,mf,ci.numDia);
        if(desde&&fecha<desde)continue;
        if(hasta&&fecha>hasta)continue;
        if(!cols[key])cols[key]={nombre:nom,dias:[]};
        cols[key].dias.push({fecha,diaSemana:ci.diaSemana,turno:tr});
      }
    }
  }
  for(const c of Object.values(cols))c.dias.sort((a,b)=>a.fecha-b.fecha);
  return cols;
}

function nombreHoja(nombre,usados){
  const base=nombre.replace(/[\[\]:*?/\\]/g,"").trim();
  let candidate=base.substring(0,31);
  if(!usados.has(candidate)){usados.add(candidate);return candidate;}
  let n=2;
  while(true){
    const suf=`_${n}`;
    candidate=base.substring(0,31-suf.length)+suf;
    if(!usados.has(candidate)){usados.add(candidate);return candidate;}
    n++;
  }
}

function generarXLSX(colaboradores,mesLabel){
  const wb=XLSX.utils.book_new();const cf=[];let idx=1;
  const usados=new Set(["CONSOLIDADO"]);
  for(const[,col]of Object.entries(colaboradores)){
    const wd=[];
    wd.push(["REPORTE DE TRABAJO"]);wd.push([]);
    wd.push(["MES",mesLabel]);wd.push([]);
    wd.push(["NOMBRE",col.nombre]);wd.push([]);
    wd.push(["DIA","FECHA","HORARIO","#HORAS","OBSERVACION","CPS",
      "DOMINICAL","REC. NOCT. FEST","REC. NOCT","H.E.D","H.E.N","H.E.F.D","H.E.F.N"]);
    const tots={};for(const c of COLS)tots[c]=0;let th=0;
    for(const dia of col.dias){
      const segs=parseTurno(dia.turno);
      if(!segs){wd.push([dia.diaSemana,dia.fecha.getDate(),dia.turno]);continue;}
      const h=clasificar(segs,dia.fecha);
      let td=0;for(const s of segs)td+=s.fin-s.ini;td=Math.round(td*100)/100;th+=td;
      for(const c of COLS)tots[c]+=h[c];
      wd.push([dia.diaSemana,dia.fecha.getDate(),dia.turno,td,null,null,
        h["DOMINICAL"]||null,h["REC. NOCT. FEST"]||null,h["REC. NOCT"]||null,
        h["H.E.D"]||null,h["H.E.N"]||null,h["H.E.F.D"]||null,h["H.E.F.N"]||null]);
    }
    wd.push(["TOTAL",null,null,Math.round(th*100)/100,null,null,
      tots["DOMINICAL"]||null,tots["REC. NOCT. FEST"]||null,tots["REC. NOCT"]||null,
      tots["H.E.D"]||null,tots["H.E.N"]||null,tots["H.E.F.D"]||null,tots["H.E.F.N"]||null]);
    const sn=nombreHoja(col.nombre,usados);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(wd),sn);
    cf.push({idx:idx++,nombre:col.nombre,tots:{...tots},
      total:Object.values(tots).reduce((a,b)=>a+b,0)});
  }
  const cs=[];
  cs.push([`NOVEDADES NOMINA MES DE ${mesLabel}`]);
  cs.push([null,null,null,"DOMINICAL 80%","REC. NOCT.FEST %","REC. NOCT 35%",
    "H.E.D 25%","H.E.N 75%","H.E.F.D 100%","H.E.F.N 150%"]);
  cs.push([]);
  cs.push([null,"NOMBRE COMPLETO",null,"DOMINICAL","REC. NOCT. FEST","REC. NOCT",
    "H.E.D","H.E.N","H.E.F.D","H.E.F.N","OBS","TOTAL"]);
  for(const f of cf)cs.push([f.idx,f.nombre,null,
    f.tots["DOMINICAL"]||null,f.tots["REC. NOCT. FEST"]||null,f.tots["REC. NOCT"]||null,
    f.tots["H.E.D"]||null,f.tots["H.E.N"]||null,f.tots["H.E.F.D"]||null,
    f.tots["H.E.F.N"]||null,null,f.total||null]);
  const tot={};for(const c of COLS)tot[c]=cf.reduce((s,f)=>s+(f.tots[c]||0),0);
  cs.push(["TOTALES",null,null,tot["DOMINICAL"]||null,tot["REC. NOCT. FEST"]||null,
    tot["REC. NOCT"]||null,tot["H.E.D"]||null,tot["H.E.N"]||null,
    tot["H.E.F.D"]||null,tot["H.E.F.N"]||null,"TOTAL:",
    cf.reduce((s,f)=>s+f.total,0)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cs),"CONSOLIDADO");
  return wb;
}

  {val:"PC_PEREIRA",label:"PC Pereira"},
  {val:"PC_COLINAS",label:"PC Colinas"},
  {val:"PC_CARTAGO",label:"PC Cartago"},
  {val:"PC_QUINDIO",label:"PC Quindío"},
];

const inp={
  width:"100%",background:"rgba(255,255,255,0.06)",
  border:"1px solid #1E3A6E",borderRadius:3,padding:"10px 12px",
  color:"#FFFFFF",fontSize:13,fontFamily:"'Nunito Sans',sans-serif",outline:"none",
};
const lbl={
  display:"block",fontSize:10,letterSpacing:3,color:"#B3B3B3",
  textTransform:"uppercase",fontFamily:"'Nunito Sans',sans-serif",marginBottom:7,
};

function App(){
  const[archivo,setArchivo]=useState(null);
  const[nombreArchivo,setNombreArchivo]=useState("");
  const[regional,setRegional]=useState("");
  const[mes,setMes]=useState("");
  const[desde,setDesde]=useState("");
  const[hasta,setHasta]=useState("");
  const[procesando,setProcesando]=useState(false);
  const[resultado,setResultado]=useState(null);
  const[error,setError]=useState(null);
  const[preview,setPreview]=useState(null);

  const cargar=useCallback(f=>{
    if(!f)return;
    setArchivo(f);setNombreArchivo(f.name);
    setError(null);setResultado(null);setPreview(null);
  },[]);

  const procesar=useCallback(async()=>{
    if(!archivo){setError("Selecciona el SemanarioCDP.xlsx");return;}
    if(!regional){setError("Selecciona la regional o parque");return;}
    if(!mes.trim()){setError("Indica el mes/período (ej: MAYO 2026)");return;}
    setProcesando(true);setError(null);
    try{
      const buf=await archivo.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const d=procesarWB(wb,
        desde?new Date(desde+"T00:00:00"):null,
        hasta?new Date(hasta+"T23:59:59"):null);
      const n=Object.keys(d).length;
      if(!n){setError("Sin colaboradores en el rango indicado.");setProcesando(false);return;}
      const wbo=generarXLSX(d,mes.toUpperCase().trim());
      const prev=Object.values(d).map(col=>{
        const t={};for(const c of COLS)t[c]=0;
        for(const dia of col.dias){
          const s=parseTurno(dia.turno);if(!s)continue;
          const h=clasificar(s,dia.fecha);for(const c of COLS)t[c]+=h[c];
        }
        return{nombre:col.nombre,t,
          ext:t["H.E.D"]+t["H.E.N"]+t["H.E.F.D"]+t["H.E.F.N"]};
      });
      setPreview(prev);
      const fn=`HORAS_EXTRAS_${mes.toUpperCase().replace(/\s+/g,"_")}_${regional}.xlsx`;
      XLSX.writeFile(wbo,fn);
      setResultado({n,fn});
    }catch(e){setError("Error: "+e.message);}
    setProcesando(false);
  },[archivo,regional,mes,desde,hasta]);

  return(
    <div style={{minHeight:"100vh",background:LO.azulOscuro,
      fontFamily:"'Nunito Sans','Segoe UI',sans-serif",color:LO.blanco}}>

      {/* HEADER */}
      <div style={{background:LO.azul,borderBottom:"3px solid #FF008F",padding:"0 32px"}}>
        <div style={{maxWidth:900,margin:"0 auto",padding:"14px 0",
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <img src={LOGO_B64} alt="La Ofrenda®"
            style={{height:48,width:"auto",display:"block",objectFit:"contain"}}/>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,letterSpacing:3,color:LO.gris,
              textTransform:"uppercase",marginBottom:2}}>
              Gerencia de Operaciones
            </div>
            <div style={{fontSize:16,fontWeight:700,color:LO.blanco}}>
              Calculadora de Horas Extra
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:900,margin:"0 auto",padding:"28px 20px"}}>

        {/* DROP ZONE */}
        <div onDrop={e=>{e.preventDefault();cargar(e.dataTransfer.files[0]);}}
          onDragOver={e=>e.preventDefault()}
          onClick={()=>document.getElementById("fi").click()}
          style={{border:`2px dashed ${archivo?"rgba(255,0,143,0.6)":LO.azulBorde}`,
            borderRadius:6,padding:"26px 20px",textAlign:"center",cursor:"pointer",
            background:archivo?LO.magentaFaint:"rgba(255,255,255,0.02)",
            marginBottom:22,transition:"border 0.2s,background 0.2s"}}>
          <input id="fi" type="file" accept=".xlsx,.xls"
            onChange={e=>cargar(e.target.files[0])} style={{display:"none"}}/>
          {archivo?(
            <div>
              <div style={{fontSize:24,marginBottom:6}}>📋</div>
              <div style={{color:LO.blanco,fontWeight:700,fontSize:14}}>{nombreArchivo}</div>
              <div style={{fontSize:11,color:LO.textoDim,marginTop:4}}>Clic para cambiar</div>
            </div>
          ):(
            <div>
              <div style={{fontSize:28,marginBottom:8,opacity:0.3}}>📂</div>
              <div style={{fontSize:14,color:LO.textoSub,fontWeight:600}}>Arrastra o haz clic</div>
              <div style={{fontSize:11,color:LO.textoDim,marginTop:4}}>
                SemanarioCDP.xlsx · Una o varias hojas
              </div>
            </div>
          )}
        </div>

        {/* CAMPOS */}
        <div style={{display:"grid",gridTemplateColumns:"1.3fr 1.3fr 1fr 1fr",
          gap:14,marginBottom:20}}>
          <div>
            <label style={lbl}>Regional / Sede</label>
            <select value={regional} onChange={e=>setRegional(e.target.value)}
              style={{...inp,background:LO.azulCard,cursor:"pointer",
                color:regional?LO.blanco:LO.textoDim}}>
              <option value="" disabled>Seleccionar…</option>
              {REGIONALES.map(r=><option key={r.val} value={r.val}>{r.label}</option>)}
            </select>
          </div>
          <div>
            <label style={lbl}>Mes / Período</label>
            <input value={mes} onChange={e=>setMes(e.target.value)}
              placeholder="ej: MAYO 2026" style={inp}/>
          </div>
          <div>
            <label style={lbl}>Desde (opcional)</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={inp}/>
          </div>
          <div>
            <label style={lbl}>Hasta (opcional)</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={inp}/>
          </div>
        </div>

        {/* BOTÓN */}
        <button onClick={procesar} disabled={procesando} style={{
          width:"100%",padding:"14px",
          background:procesando?"rgba(255,0,143,0.20)":LO.magenta,
          border:"none",borderRadius:4,color:LO.blanco,
          fontSize:14,fontWeight:700,letterSpacing:2.5,
          textTransform:"uppercase",cursor:procesando?"not-allowed":"pointer",
          opacity:procesando?0.6:1,fontFamily:"'Nunito Sans',sans-serif"}}>
          {procesando?"Procesando turnos…":"Generar Reporte de Horas Extra"}
        </button>

        {/* ERROR */}
        {error&&(
          <div style={{marginTop:16,padding:"13px 16px",background:LO.rojoBg,
            border:`1px solid ${LO.rojoBorde}`,borderRadius:4,
            color:"#FF6B6B",fontSize:13,fontWeight:600}}>
            ⚠ {error}
          </div>
        )}

        {/* ÉXITO */}
        {resultado&&(
          <div style={{marginTop:16,padding:"14px 18px",background:LO.verdeBg,
            border:`1px solid ${LO.verdeBorde}`,borderRadius:4}}>
            <div style={{color:"#58D68D",fontWeight:700,marginBottom:3,fontSize:14}}>
              ✓ Archivo generado y descargado
            </div>
            <div style={{fontSize:12,color:LO.textoDim}}>
              {resultado.n} colaboradores · {resultado.fn}
            </div>
          </div>
        )}

        {/* PREVIEW */}
        {preview&&preview.length>0&&(
          <div style={{marginTop:28}}>
            <div style={{fontSize:10,letterSpacing:3,color:LO.gris,
              textTransform:"uppercase",marginBottom:14}}>
              Vista Previa — Totales por Colaborador
            </div>
            <div style={{background:LO.azulCard,border:`1px solid ${LO.azulBorde}`,
              borderRadius:6,overflow:"hidden"}}>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead>
                    <tr style={{borderBottom:"2px solid #FF008F",
                      background:"rgba(255,0,143,0.06)"}}>
                      {["Colaborador","DOM","R.N.F","R.NOC","H.E.D","H.E.N",
                        "H.E.F.D","H.E.F.N","EXT TOTAL"].map((h,i)=>(
                        <th key={i} style={{padding:"10px",
                          textAlign:i===0?"left":"center",
                          color:LO.gris,fontWeight:600,
                          fontSize:9,letterSpacing:1.5,textTransform:"uppercase"}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {preview.map((p,i)=>(
                      <tr key={i} style={{
                        borderBottom:`1px solid ${LO.azulBorde}`,
                        background:i%2===0?"rgba(255,255,255,0.02)":"transparent"}}>
                        <td style={{padding:"8px 10px",color:LO.blanco,
                          fontSize:12,fontWeight:600}}>{p.nombre}</td>
                        {COLS.map(c=>(
                          <td key={c} style={{padding:"8px 10px",textAlign:"center",
                            color:p.t[c]>0?LO.textoSub:LO.textoFaint}}>
                            {p.t[c]>0?p.t[c]:"—"}
                          </td>
                        ))}
                        <td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,
                          background:p.ext>0?"rgba(255,0,143,0.15)":"transparent",
                          color:LO.blanco,fontSize:13}}>
                          {p.ext>0?Math.round(p.ext*100)/100:"—"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {/* PIE LEGAL */}
        <div style={{marginTop:32,padding:"14px 18px",
          border:`1px solid ${LO.azulBorde}`,borderRadius:4,
          fontSize:10,color:LO.textoDim,lineHeight:1.9}}>
          <span style={{color:LO.gris,letterSpacing:2,fontSize:9}}>
            MARCO NORMATIVO · </span>
          Nocturno ≥ 19:00 · Ley 2466/2025 desde 25-dic-2025 · Jornada 8h/día ·
          44h/sem hasta 15-jul-2026 · Festivos Colombia 2026 (Ley Emiliani) ·
          DOM 80% · R.N.F 35%+75% · R.NOC 35% · H.E.D 25% · H.E.N 75% · H.E.F.D 100% · H.E.F.N 150%
        </div>

        <div style={{marginTop:20,paddingTop:16,
          borderTop:`1px solid ${LO.azulBorde}`,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:9,color:LO.textoDim,letterSpacing:1}}>
            La Ofrenda® · Herramienta Interna · Gerencia TIC
          </div>
          <div style={{fontSize:9,color:LO.gris,letterSpacing:2,textTransform:"uppercase"}}>
            Protección para vivir tranquilo
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
